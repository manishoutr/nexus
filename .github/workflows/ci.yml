name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff && ruff check .
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pkill -f "redis.*6391" || true
      - run: python -m pytest -q
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nexus, POSTGRES_PASSWORD: nexus, POSTGRES_DB: nexus_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://nexus:nexus@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: built bundle in app/static must match the source
        run: git diff --exit-code -- ../app/static/index.html
  docker-smoke:
    # Builds the image and runs the whole compose stack on the free GitHub runner, then
    # drives it through the real API: sign up, upload, wait for the Celery worker, ask.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start the stack
        run: |
          echo "JWT_SECRET=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" > .env
          docker compose up -d --build
      - name: wait for readiness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' localhost:8000/api/ready || true)
            [ "$code" = 200 ] && break; sleep 3
          done
          cat /tmp/ready.json; [ "$code" = 200 ]
      - name: end to end through the API
        run: |
          B=localhost:8000
          TOKEN=$(curl -sf $B/api/auth/register -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci-password-123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          H="Authorization: Bearer $TOKEN"
          WS=$(curl -sf $B/api/workspaces -H "$H" -H 'Content-Type: application/json' -d '{"name":"ci"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sf $B/api/workspaces/$WS/documents -H "$H" -F "file=@seed_docs/odisha-handlooms.txt" > /dev/null
          for i in $(seq 1 40); do
            S=$(curl -sf $B/api/workspaces/$WS/documents -H "$H" | python3 -c 'import sys,json;print(json.load(sys.stdin)[0]["status"])')
            [ "$S" = done ] && break; sleep 2
          done
          echo "status=$S"; [ "$S" = done ]
          curl -sf $B/api/workspaces/$WS/ask -H "$H" -H 'Content-Type: application/json' -d '{"question":"Which Odisha weave uses ikat?"}' | tee /tmp/ask.json
          python3 -c 'import json;d=json.load(open("/tmp/ask.json"));assert d["citations"] and not d["abstained"]'
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -150
