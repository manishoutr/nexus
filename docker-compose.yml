# Full stack: API, Celery worker + beat, PostgreSQL with pgvector, Redis, MinIO (S3-compatible).
# STATUS: syntax-checked only. Docker was not available where this was written,
# so `docker compose up` has not been run. Set JWT_SECRET first (see .env.example).
#   JWT_SECRET=$(python -c "import secrets;print(secrets.token_urlsafe(48))") docker compose up --build
x-app-env: &app-env
  APP_ENV: production
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of 32+ characters}
  DATABASE_URL: postgresql+psycopg2://nexus:${POSTGRES_PASSWORD:-nexus}@db:5432/nexus
  QUEUE_BACKEND: celery
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_STORAGE: redis://redis:6379/1
  STORAGE_BACKEND: s3
  S3_BUCKET: nexus-documents
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODE: ${LLM_MODE:-auto}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}

services:
  api:
    build: { context: ., args: { WITH_ML: "${WITH_ML:-0}" } }
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
  worker:
    build: { context: ., args: { WITH_ML: "${WITH_ML:-0}" } }
    command: celery -A app.services.tasks worker -l info
    environment: *app-env
    depends_on: [api]
  beat:
    build: { context: ., args: { WITH_ML: "${WITH_ML:-0}" } }
    command: celery -A app.services.tasks beat -l info -s /tmp/celerybeat-schedule
    environment: *app-env
    depends_on: [api]
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_USER:-minioadmin} $${MINIO_PASSWORD:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/nexus-documents"
    environment:
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
volumes:
  pgdata:
  miniodata:
