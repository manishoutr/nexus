<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Nexus</h1>
    <span id="mode-badge" class="badge">...</span>
    <nav>
      <button class="tab active" data-tab="documents">Documents</button>
      <button class="tab" data-tab="search">Search</button>
      <button class="tab" data-tab="ask">Ask</button>
    </nav>
  </header>

  <main>
    <div class="workspace-bar">
      <label>Workspace</label>
      <select id="workspace-select"></select>
      <input id="new-workspace" placeholder="New workspace name" />
      <button id="create-workspace">Create</button>
    </div>

    <!-- DOCUMENTS -->
    <section id="tab-documents" class="panel active">
      <h2>Documents</h2>
      <p class="hint">Upload PDF, DOCX or TXT (max 10 MB). Ingestion runs in the background; statuses refresh automatically.</p>
      <input type="file" id="doc-file" accept=".pdf,.docx,.txt,.md" />
      <button id="upload-btn">Upload</button>
      <span id="upload-status"></span>
      <div id="doc-list"></div>
    </section>

    <!-- SEARCH -->
    <section id="tab-search" class="panel">
      <h2>Hybrid search</h2>
      <div class="searchbar">
        <input id="search-input" placeholder="Search by keyword or meaning" />
        <button id="search-btn">Search</button>
      </div>
      <div id="search-results"></div>
    </section>

    <!-- ASK -->
    <section id="tab-ask" class="panel">
      <h2>Ask with citations</h2>
      <p class="hint">Nexus answers only from retrieved passages and says when evidence is insufficient. Every answer links back to its sources.</p>
      <div class="searchbar">
        <input id="ask-input" placeholder="Ask a question about your documents" />
        <button id="ask-btn">Ask</button>
      </div>
      <div id="ask-output"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
